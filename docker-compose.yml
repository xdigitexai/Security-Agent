services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xdigitex
      POSTGRES_PASSWORD: xdigitex
      POSTGRES_DB: xdigitex_security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdigitex -d xdigitex_security"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xdigitex:xdigitex@postgres:5432/xdigitex_security?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://xdigitex:xdigitex@postgres:5432/xdigitex_security?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  test-target:
    build:
      context: .
      dockerfile: apps/test-target/Dockerfile
    environment:
      PORT: 4010
    ports:
      - "4010:4010"

volumes:
  postgres-data:
  redis-data:
